    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d0f;
            color: #ffffff;
        }

        .sport-bg-pattern {
            background-color: #0a0b0d;
            background-image: repeating-linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.03),
                rgba(255, 255, 255, 0.03) 25px,
                transparent 25px,
                transparent 70px
            );
        }

        .sport-card-bg {
            background-color: #0d0e12;
            background-image: 
                linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 40%),
                repeating-linear-gradient(
                    -45deg,
                    rgba(255, 255, 255, 0.04),
                    rgba(255, 255, 255, 0.04) 20px,
                    transparent 20px,
                    transparent 60px
                );
        }

        /* Ancho amplio y horizontal sin forzar aspect-ratio estricto para evitar pantallas en blanco */
        #captureCard {
            width: 100%;
            max-width: 680px;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="sport-bg-pattern min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-xl mx-auto">
        
        <!-- VISTA 1: FORMULARIO DE REGISTRO -->
        <div id="formSection" class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 sm:p-8 shadow-2xl backdrop-blur-md">
            <div class="flex flex-col items-center mb-6 text-center">
                <div class="flex items-center gap-3 mb-2">
                    <img data-logo alt="Forward Sport" class="w-14 h-auto">
                    <div class="text-left">
                        <h1 class="text-2xl font-black tracking-widest italic leading-none">FORWARD</h1>
                        <span class="text-xs tracking-[0.3em] font-light text-slate-400 block -mt-0.5">SPORT</span>
                    </div>
                </div>
                <h2 class="text-lg font-bold text-emerald-400 mt-2">📦 Datos para Envío de Pedido</h2>
                <p class="text-xs text-slate-400 mt-1">Completa los campos necesarios para generar tu ficha oficial.</p>
            </div>

            <form id="shippingForm" onsubmit="generateShippingCard(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase mb-1">
                        <i class="fa-solid fa-user text-emerald-400 mr-1.5"></i> Nombre y Apellidos Completos
                    </label>
                    <input type="text" id="inputName" placeholder="Ej. Juan Pérez García" 
                        class="w-full px-4 py-3 bg-black/60 border border-slate-700 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white placeholder-slate-500 outline-none transition text-sm">
                </div>

        // Solo se usa en computadora para abrir el chat; en celular el usuario elige el chat al compartir.
        const WHATSAPP_NUMBER = '51963127315';

        let currentData = {};
        let cachedBlob = null;
        let pendingOpenChat = false;

        function generateShippingCard(e) {
            e.preventDefault();

            try {
                cachedBlob = null;
                pendingOpenChat = false;
                setWaUI('Enviar por WhatsApp', '');
                currentData = {
                    name: document.getElementById('inputName')?.value.trim() || 'No especificado',
                    dni: document.getElementById('inputDni')?.value.trim() || 'No especificado',
                    phone: document.getElementById('inputPhone')?.value.trim() || 'No especificado',
                    agency: document.getElementById('inputAgency')?.value.trim() || 'No especificado',
                    city: document.getElementById('inputCity')?.value.trim() || 'No especificado',
                    address: document.getElementById('inputAddress')?.value.trim() || 'No especificado'
                };

                const assignText = (id, value) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = value;
                };

                assignText('cardName', currentData.name);
                assignText('cardDni', currentData.dni);
                assignText('cardPhone', currentData.phone);
                assignText('cardAgency', currentData.agency);
                assignText('cardCity', currentData.city);
                assignText('cardAddress', currentData.address);

                const formSec = document.getElementById('formSection');
                const resSec = document.getElementById('resultSection');

                if (formSec) formSec.classList.add('hidden');
                if (resSec) resSec.classList.remove('hidden');

                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                console.error("Error al generar la ficha:", err);
            }
        }

        function editForm() {
            document.getElementById('resultSection')?.classList.add('hidden');
            document.getElementById('formSection')?.classList.remove('hidden');
        }

        // ---- Incrustar fuentes (Inter + iconos Font Awesome) para que salgan en el PNG ----
        let fontEmbedCache = null;
        const dataUrlCache = {};

        async function urlToDataUrl(url) {
            if (dataUrlCache[url]) return dataUrlCache[url];
            const res = await fetch(url);
            const blob = await res.blob();
            const data = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
            dataUrlCache[url] = data;
            return data;
        }

        async function buildFontEmbedCSS() {
            if (fontEmbedCache !== null) return fontEmbedCache;
            let css = '';

            // Fuente Inter (solo subconjuntos latin para que sea liviano)
            try {
                const gfRes = await fetch('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
                const gfCss = await gfRes.text();
                const blocks = [...gfCss.matchAll(/\/\*\s*([\w-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g)];
                for (const [, subset, block] of blocks) {
                    if (subset !== 'latin' && subset !== 'latin-ext') continue;
                    const m = block.match(/url\((https:[^)]+)\)/);
                    if (!m) continue;
                    const data = await urlToDataUrl(m[1]);
                    css += block.replace(m[1], data);
                }
            } catch (err) {
                console.warn("No se pudo incrustar Inter:", err);
            }

            fontEmbedCache = css;
            return css;
        }

        // ---- Convierte cada icono de Font Awesome en una imagen (solo durante la captura) ----
        // Dibuja el glifo ya cargado en pantalla sobre un canvas, así no depende de incrustar la fuente.
        function iconsToImages(root) {
            const swaps = [];
            root.querySelectorAll('i.fa-solid, i.fa-regular, i.fa-brands').forEach(icon => {
                try {
                    const cs = getComputedStyle(icon);
                    const before = getComputedStyle(icon, '::before');
                    const glyph = (before.content || '').replace(/^["']|["']$/g, '');
                    if (!glyph || glyph === 'none' || glyph === 'normal') return;

                    const size = parseFloat(before.fontSize) || parseFloat(cs.fontSize) || 14;
                    const scale = 4;
                    const font = `${before.fontWeight} ${size * scale}px ${before.fontFamily}`;

                    const measureCtx = document.createElement('canvas').getContext('2d');
                    measureCtx.font = font;
                    const m = measureCtx.measureText(glyph);
                    const ascent = (m.fontBoundingBoxAscent || size * 0.875 * scale);
                    const descent = (m.fontBoundingBoxDescent || size * 0.125 * scale);

                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.ceil(m.width));
                    canvas.height = Math.max(1, Math.ceil(ascent + descent));
                    const ctx = canvas.getContext('2d');
                    ctx.font = font;
                    ctx.fillStyle = cs.color;
                    ctx.textBaseline = 'alphabetic';
                    ctx.fillText(glyph, 0, ascent);

                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/png');
                    img.style.display = 'block';
                    img.style.width = (canvas.width / scale) + 'px';
                    img.style.height = (canvas.height / scale) + 'px';
                    img.style.flexShrink = '0';

                    icon.replaceWith(img);
                    swaps.push([icon, img]);
                } catch (err) {
                    console.warn("No se pudo convertir un icono:", err);
                }
            });
            return swaps;
        }

        // ---- Genera la imagen PNG de la ficha (misma lógica de antes) ----
        async function renderCardBlob() {
            const cardElement = document.getElementById('captureCard');
            if (!cardElement) throw new Error('No se encontró la tarjeta');

            const origWidth = cardElement.style.width;
            const origMaxWidth = cardElement.style.maxWidth;
            let iconSwaps = [];

            try {
                await document.fonts.ready;
                const fontEmbedCSS = await buildFontEmbedCSS();

                // Iconos -> imágenes (para que salgan siempre en el PNG)
                iconSwaps = iconsToImages(cardElement);

                // Ancho de 1000px para la captura (la tarjeta se reacomoda a ese ancho)
                cardElement.style.width = '1000px';
                cardElement.style.maxWidth = '1000px';
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                return await htmlToImage.toBlob(cardElement, {
                    pixelRatio: 2,
                    backgroundColor: '#000000',
                    cacheBust: true,
                    fontEmbedCSS: fontEmbedCSS || undefined
                });
            } finally {
                // Restaura iconos originales y tamaño de la tarjeta
                iconSwaps.forEach(([icon, img]) => img.replaceWith(icon));
                cardElement.style.width = origWidth;
                cardElement.style.maxWidth = origMaxWidth;
            }
        }

        function getFileName() {
            const safeName = currentData.name && currentData.name !== 'No especificado'
                ? currentData.name.replace(/[^\w\-áéíóúñÁÉÍÓÚÑ]+/g, '_')
                : 'Cliente';
            return `Envio_ForwardSport_${safeName}.png`;
        }

        function saveBlob(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = fileName;
            link.href = url;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function setWaUI(label, status) {
            const labelEl = document.getElementById('btnWhatsappLabel');
            const statusEl = document.getElementById('waStatus');
            if (labelEl) labelEl.textContent = label;
            if (statusEl) statusEl.textContent = status || '';
        }

        // ---- Enviar la foto por WhatsApp ----
        // Celular: abre el menú de compartir con la imagen ya adjunta (elige WhatsApp y el chat).
        // Computadora: copia la imagen y abre WhatsApp para pegarla (Ctrl+V).
        async function sendViaWhatsApp() {
            const btn = document.getElementById('btnWhatsapp');
            const defaultLabel = 'Enviar por WhatsApp';

            // Segundo toque (celular sin menú de compartir): abrir el chat para adjuntar la imagen guardada
            if (pendingOpenChat) {
                pendingOpenChat = false;
                setWaUI(defaultLabel, '');
                window.open(`https://wa.me/${WHATSAPP_NUMBER}`, '_blank', 'noopener');
                return;
            }

            try {
                if (!cachedBlob) {
                    btn.disabled = true;
                    setWaUI('Preparando imagen...', '');
                    cachedBlob = await renderCardBlob();
                    btn.disabled = false;
                }

                const fileName = getFileName();
                const file = new File([cachedBlob], fileName, { type: 'image/png' });

                // 1) Compartir la imagen directamente (celulares y navegadores compatibles)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file] });
                        setWaUI(defaultLabel, '');
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') {            // el usuario cerró el menú
                            setWaUI(defaultLabel, '');
                            return;
                        }
                        if (err.name === 'NotAllowedError') {       // el navegador pide un toque directo
                            setWaUI('Imagen lista: toca para enviar', 'Toca el botón otra vez para abrir WhatsApp.');
                            return;
                        }
                        throw err;
                    }
                }

                // 2) Celular sin menú de compartir (p. ej. página abierta como archivo, sin https)
                if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    saveBlob(cachedBlob, fileName);
                    pendingOpenChat = true;
                    setWaUI('Abrir chat de WhatsApp', window.isSecureContext
                        ? 'Imagen guardada en tu celular. Abre el chat y adjúntala con el clip.'
                        : 'Imagen guardada. Para enviarla directo, la página debe abrirse desde un enlace https. Por ahora abre el chat y adjúntala con el clip.');
                    return;
                }

                // 3) Computadora: copiar la imagen y abrir WhatsApp
                let copied = false;
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': cachedBlob })]);
                        copied = true;
                    }
                } catch (err) {
                    console.warn("No se pudo copiar la imagen:", err);
                }

                if (!copied) saveBlob(cachedBlob, fileName);

                const waUrl = WHATSAPP_NUMBER ? `https://wa.me/${WHATSAPP_NUMBER}` : 'https://web.whatsapp.com/';
                window.open(waUrl, '_blank', 'noopener');

                setWaUI(defaultLabel, copied
                    ? 'Imagen copiada. En WhatsApp, abre el chat y pégala con Ctrl+V.'
                    : 'Imagen descargada. En WhatsApp, adjúntala al chat.');
            } catch (error) {
                console.error("Error al enviar por WhatsApp:", error);
                btn.disabled = false;
                setWaUI(defaultLabel, 'No se pudo preparar la imagen. Intenta de nuevo.');
            }
        }
    </script>
